<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body>
<div class="container">
    <section class="form-section">
        <h1 class="titulo-form">Bem-Vindo!</h1>

        <div th:if="${sucesso}" class="success-msg" th:text="${sucesso}"></div>

        <form th:action="@{/login}" th:object="${loginDTO}" method="post" class="form-content">
            
            <div th:if="${#fields.hasGlobalErrors()}" class="error-msg">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <div>
                <input type="text" id="username" th:field="*{username}" placeholder="Usuário ou E-mail">
                <span class="error-msg" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>

                <input type="password" id="password" th:field="*{password}" placeholder="Senha">
                <span class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <div class="form-button-container">
                <button type="submit">Entrar</button>
            </div>

            <p>
                <strong>Ainda não tem cadastro?</strong> <br>
                <div class="redirect-links">
                    <a th:href="@{/register}">Cadastre-se | </a>
                    <a th:href="@{/recoverpassword}">Recuperar senha</a>
                </div>
            </p>
        </form>
    </section>
</div>
</body>
</html>
