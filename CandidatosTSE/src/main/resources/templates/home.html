<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatos TSE - Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1 class="titulo-site">Candidatos - Eleições 2026 - MG</h1>
    </header>
    <main>
        <div class="filtros-container">
            <form method="get" th:action="@{/home}" class="filtros">
                <input type="text" name="texto" th:value="${textoSelecionado}">
                <select name="cargo">
                    <option value="" th:selected="${cargoSelecionado == ''}">Todos</option>
                    <option th:each="c : ${cargos}" th:value="${c}" th:text="${c}" th:selected="${c == cargoSelecionado}"></option>
                </select>
                <select name="partido">
                    <option value="" th:selected="${partidoSelecionado == ''}">Todos></option>
                    <option th:each="p : ${partidos}" th:value="${p}" th:text="${p}" th:selected="${p == partidoSelecionado}"></option>
                </select>
                <button type="submit">Filtrar</button>
                <a th:href="@{/home}" class="limpar">Limpar</a>
            </form>
        </div>
        <div class="grade-candidatos">
            <div class="card" th:each="cand : ${candidatos}">
                <img th:src="@{'/images/candidatos/' + ${cand.nomeArquivoFoto}}"
                    th:alt="${cand.nomeUrna}" class="foto-candidato">
                <p class="nome" th:text="${cand.nomeCandidato}">Nome</p>
                <p class="cargo" th:text="${cand.cargo}">Cargo</p>
                <p class="sigla-partido" th:text="${cand.siglaPartido}">Sigla do partido</p>
                <p class="nome-partido" th:text="${cand.nomePartido}">Nome do partido</p>
                <p class="numero" th:text="${cand.nrCandidato}">Numero</p>
                <p class="situacao" th:if="${cand.situacaoCandidatura != null and !cand.situacaoCandidatura.isBlank()}" th:text="${cand.situacaoCandidatura}">Situacao</p>
                <p class="extra" th:if="${cand.idade > 0}">
                    <span th:text="${cand.idade + ' anos'}">Idade</span>
                </p>
                <p class="extra" th:if="${cand.ocupacao != null and cand.ocupacao.isBlank()}" th:text="${cand.ocupacao}">Ocupação></p>
                <p class="extra" th:if="${cand.grauInstrucao != null and cand.grauInstrucao.isBlank()}" th:text="${cand.grauInstrucao}">Escolaridade></p>
            </div>
        </div>
    </main>
</body>
</html>
